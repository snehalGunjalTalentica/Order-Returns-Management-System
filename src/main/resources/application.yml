spring:
  application:
    name: order-returns-management
  
  datasource:
    url: jdbc:h2:mem:articurateddb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

jwt:
  secret: ArtiCuratedSecretKeyForJWTTokenGeneration2024SecureKey
  expiration: 86400000 # 24 hours in milliseconds

payment:
  gateway:
    url: http://localhost:8080/mock-payment-gateway/refund
    timeout: 5000

server:
  port: 8080

logging:
  level:
    com.articurated: DEBUG
    org.springframework.batch: INFO
    org.springframework.security: DEBUG



